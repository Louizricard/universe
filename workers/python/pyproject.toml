[project]
name = "universe-worker"
version = "0.1.0"
description = "Universe local Python NDJSON-RPC sidecar worker for media, PDF, document, OCR, and AI processing"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["universe_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
